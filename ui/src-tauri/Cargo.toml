[package]
name = "relay-ui"
description = "Relay desktop shell (Tauri). Separate process; closing the window costs nothing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "relay_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
relay-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tauri = { version = "2.11", features = ["protocol-asset"] }
