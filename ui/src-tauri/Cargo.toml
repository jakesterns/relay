[package]
name = "relay-ui"
description = "Relay desktop shell (Tauri). Separate process; closing the window costs nothing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# tauri-build writes the rest of relay-ui.exe's version resource from
# tauri.conf.json (productName, bundle.publisher, bundle.copyright); these are
# the two fields it leaves out. Keep in step with build-support/versioninfo.rs.
[package.metadata.tauri-winres]
OriginalFilename = "relay-ui.exe"
InternalName = "relay-ui"

[lib]
name = "relay_ui_lib"
# rlib only: staticlib/cdylib are for Tauri mobile, which Relay does not
# target. A cdylib here would also inherit the version resources of the
# relay-apo and relay-vdevice cdylibs (cargo passes cdylib link args on to
# dependents) and fail to link with a duplicate VERSION resource.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
relay-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tauri = { version = "2.11", features = ["protocol-asset"] }

# Window placement (window_state.rs): the normal bounds Tauri does not expose.
# And the stream window (stream_host.rs): positioning the engine's window
# over the video area.
[target.'cfg(windows)'.dependencies]
# The WebView2 PermissionRequested handler (permissions.rs). Same version
# wry already links, so this adds no second copy.
webview2-com = "0.38"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # S51: ShellExecuteW for the two fixed NDI links (open_ndi_link).
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
