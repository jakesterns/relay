[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/audio",
    "crates/audio/apo",
    "crates/capture",
    "crates/vdevice",
    "crates/display",
    "ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
relay-core = { path = "crates/core" }
# default-features off so the always-on core can take params + sessions
# without the FFT-heavy DSP; consumers that want the chain add `features = ["dsp"]`.
relay-audio = { path = "crates/audio", default-features = false }
# Same idea: default-features off gives the registration/status engine only;
# the APO DLL itself (feature "com") hosts the DSP.
relay-apo = { path = "crates/audio/apo", default-features = false }
relay-capture = { path = "crates/capture" }
# Same idea again: default-features off is the planner/ring/control half; the
# camera media source DLL itself is feature "com".
relay-vdevice = { path = "crates/vdevice", default-features = false }
relay-display = { path = "crates/display" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
directories = "6.0"
parking_lot = "0.12"
uuid = { version = "1.26", features = ["v4", "serde"] }
windows = "0.62"
windows-core = "0.62"

# The always-on core must stay small. Optimise for size and strip symbols in
# release; per-crate overrides can relax this for the encoder later.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
