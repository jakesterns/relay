name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test, footprint (windows)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # rust-toolchain.toml pins the channel and components.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # The Tauri crate embeds ui/dist at compile time, so the frontend must
      # be built before any cargo step that touches relay-ui.
      - name: UI install + build
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Component tests against a mocked `api` module, in jsdom. They never
      # drive a real window: see ui/src/test/README.md.
      - name: UI tests
        working-directory: ui
        run: pnpm test

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Footprint gate (release relay-core, 30 s idle)
        shell: pwsh
        run: ./scripts/footprint.ps1

  licenses:
    name: Dependency licences (cargo-deny, cargo-about, pnpm)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      # Pinned: a newer tool can change how a licence expression resolves.
      - name: Install cargo-deny + cargo-about
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked cargo-about@0.9.2 --features cli

      - name: UI install (for pnpm licenses)
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # Fails on GPL/AGPL/unknown licences in any shipped crate (deny.toml),
      # then writes the licences page the installer bundles.
      - name: Licence check + licenses.html
        shell: pwsh
        run: ./scripts/licenses.ps1 -Check -Out target/licenses/licenses.html

      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: target/licenses/licenses.html
