[package]
name = "relay-audio"
description = "Relay audio: DSP (biquad EQ, partitioned-convolution HRTF, soft limiter) and the endpoint APO control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The FFT-heavy signal chain and offline renderer. The always-on core builds
# this crate with default-features = false (params + sessions only) to stay
# inside its 10 MB budget; the DSP loads on demand via the `relay-preview`
# child (and later the APO).
default = ["dsp"]
dsp = ["dep:realfft", "dep:hound"]

# Windows version resource; see build-support/versioninfo.rs.
[build-dependencies]
embed-resource = "3"

[dependencies]
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
realfft = { version = "3.4", optional = true }
hound = { version = "3.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[[bin]]
name = "relay-preview"
path = "src/bin/relay-preview.rs"
required-features = ["dsp"]

[dev-dependencies]
rustfft = "6"
