[package]
name = "relay-core"
description = "Relay always-on core: focus watcher, profile apply/restore, hotkeys, state backup, IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "relay_core"
path = "src/lib.rs"

[[bin]]
name = "relay-core"
path = "src/main.rs"

[dependencies]
# params + sessions only: the DSP (FFT) must not live in the always-on core.
relay-audio.workspace = true
# fxstore/ids only (no "com" feature): install status + registration engine.
relay-apo.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
parking_lot.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# Direct dependency because `#[implement]` expands to `::windows_core::…` paths.
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
