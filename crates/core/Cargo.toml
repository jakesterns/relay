[package]
name = "relay-core"
description = "Relay always-on core: focus watcher, profile apply/restore, hotkeys, state backup, IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "relay_core"
path = "src/lib.rs"

[[bin]]
name = "relay-core"
path = "src/main.rs"

# GUI-subsystem launcher: starts relay-core with no console window, then
# exits. The Run key and the installer go through this so logging in does not
# flash a black box. See crates/core/src/launcher.rs.
[[bin]]
name = "relay-svc"
path = "src/bin/relay-svc.rs"

# The elevated install helper. GUI subsystem (no console flash behind the UAC
# prompt), launched on demand by the core through ShellExecute's `runas`
# verb, and the only Relay binary that ever writes HKLM. See src/elevate.rs.
[[bin]]
name = "relay-elevate"
path = "src/bin/relay-elevate.rs"

# Version resources (publisher, description) for the three binaries; see
# build.rs. Already in the tree through tauri-build.
[build-dependencies]
embed-resource = "3"

[dependencies]
# params + sessions only: the DSP (FFT) must not live in the always-on core.
relay-audio.workspace = true
# fxstore/ids only (no "com" feature): install status + registration engine.
relay-apo.workspace = true
# planner/detection/installed.json only (no "com" feature): the camera media
# source DLL never links into the always-on core.
relay-vdevice.workspace = true
anyhow.workspace = true
relay-display.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
parking_lot.workspace = true
uuid.workspace = true
# SHA-256 of a downloaded update (S45). Pure Rust, already in the lock file.
sha2 = { version = "0.10", default-features = false }

[target.'cfg(windows)'.dependencies]
# Direct dependency because `#[implement]` expands to `::windows_core::…` paths.
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
