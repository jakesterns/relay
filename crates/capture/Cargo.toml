[package]
name = "relay-capture"
description = "Relay capture: Windows.Graphics.Capture / DXGI → MF HEVC hardware encode → WebRTC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The share engine. Spawned by the core per share, torn down after; the core's
# 10 MB budget does not apply to it, but it must still be lean while running.
[[bin]]
name = "relay-share"
path = "src/bin/relay-share.rs"

# Windows version resource; see build-support/versioninfo.rs.
[build-dependencies]
embed-resource = "3"

[dependencies]
relay-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
base64 = "0.22"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

async-trait = "0.1"
bytes = "1"
hmac = "0.12"
mdns-sd = "0.21"
rand = "0.9"
# S35: the DTLS identity key is persisted so this PC keeps one certificate
# fingerprint across runs and a remembered peer can be recognised at all.
# `rtc` takes an `rcgen::KeyPair` but does not re-export the type, so we have
# to name rcgen ourselves -- and it must be the SAME version rtc resolved, or
# the KeyPair we build is a different type from the one it accepts. Pinned
# deliberately: a silent minor bump is a baffling type error at best.
# Check `cargo tree -p rtc -i rcgen` before changing it.
rcgen = "=0.14.10"
# `pem` so the whole certificate round-trips: the fingerprint hashes the
# certificate, and rebuilding one from the key alone gives a new one each run.
rtc = { version = "0.20", features = ["pem"] }
sha2 = "0.10"
socket2 = "0.6"
log = "0.4"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
webrtc = "0.20"

[target.'cfg(windows)'.dependencies]
relay-vdevice.workspace = true
opus = "0.4"
windows-core = "0.62"
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_Media_MediaFoundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
