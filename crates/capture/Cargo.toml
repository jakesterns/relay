[package]
name = "relay-capture"
description = "Relay capture: Windows.Graphics.Capture / DXGI → MF HEVC hardware encode → WebRTC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The share engine. Spawned by the core per share, torn down after; the core's
# 10 MB budget does not apply to it, but it must still be lean while running.
[[bin]]
name = "relay-share"
path = "src/bin/relay-share.rs"

[dependencies]
relay-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

async-trait = "0.1"
bytes = "1"
hmac = "0.12"
mdns-sd = "0.21"
rand = "0.9"
rtc = "0.20"
sha2 = "0.10"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
webrtc = "0.20"

[target.'cfg(windows)'.dependencies]
opus = "0.4"
windows-core = "0.62"
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
